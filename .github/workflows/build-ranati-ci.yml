name: Export Ranati Gradle Cache Parts

on:
  push:
    branches: [ranati-2027-ci-final]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ranati-gradle-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore last verified source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git worktree add /tmp/ranati-verified e647144518817577f1a159fac3df65a75111775f
          cat /tmp/ranati-verified/ci/ranati/chunk*.b64 | base64 -d > /tmp/ranati-old.tar.gz
          tar -xzf /tmp/ranati-old.tar.gz -C /tmp
          rm -rf /tmp/verified_src
          mkdir /tmp/verified_src
          cp -a /tmp/ranati_ci_text/. /tmp/verified_src/
          rm -f /tmp/verified_src/signing/keystore.properties
          sed -i 's/play-services-ads:25\.4\.0/play-services-ads:24.9.0/' /tmp/verified_src/app/build.gradle.kts
          sed -i 's/user-messaging-platform:4\.0\.0/user-messaging-platform:3.2.0/' /tmp/verified_src/app/build.gradle.kts
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' /tmp/verified_src/app/build.gradle.kts
          sed -i 's/isShrinkResources = true/isShrinkResources = false/' /tmp/verified_src/app/build.gradle.kts
          sed -i 's/fun setLanguage(value: AppLanguage)/fun updateLanguage(value: AppLanguage)/' /tmp/verified_src/app/src/main/java/com/myringtone2027/ranati2027/Preferences.kt
          sed -i 's/preferences\.setLanguage(/preferences.updateLanguage(/g' /tmp/verified_src/app/src/main/java/com/myringtone2027/ranati2027/RanatiApp.kt
          sed -i 's/<string name="admob_app_id">/<string name="admob_app_id" translatable="false">/' /tmp/verified_src/app/src/main/res/values/strings.xml

      - name: Add compile placeholder resources
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/verified_src
          mkdir -p app/src/main/res/raw app/src/main/res/drawable app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          PNG='iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAM0lEQVR4nO3OQQEAMAjEsGOSpm4ScTVk8EkNNPVu/yx2NucAAAAAAAAAAAAAAAAAAABJMm13ArHk9K1DAAAAAElFTkSuQmCC'
          for f in app_icon_full cover_1 cover_2 cover_3 cover_4 cover_5 cover_6 cover_7 cover_8; do echo "$PNG" | base64 -d > "app/src/main/res/drawable/$f.png"; done
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do echo "$PNG" | base64 -d > "app/src/main/res/mipmap-$d/ic_launcher.png"; done
          for f in muscat_morning perfume_and_silk last_caravan courtyard_zaffa heliopolis_midnight copper_and_silk cairo_morning_call quarter_zaffa; do printf 'ID3' > "app/src/main/res/raw/$f.mp3"; done

      - name: Warm Gradle dependencies
        working-directory: /tmp/verified_src
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace --no-configuration-cache --max-workers=2

      - name: Package and split Gradle user home
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$HOME/.gradle" -czf /tmp/gradle-user-home.tar.gz caches wrapper 2>/dev/null || tar -C "$HOME/.gradle" -czf /tmp/gradle-user-home.tar.gz caches
          split -b 330M -d -a 2 /tmp/gradle-user-home.tar.gz /tmp/gradle-cache-part-
          ls -lh /tmp/gradle-cache-part-* /tmp/gradle-user-home.tar.gz

      - name: Upload cache part 00
        uses: actions/upload-artifact@v4
        with:
          name: Ranati-gradle-cache-part-00
          path: /tmp/gradle-cache-part-00
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload cache part 01
        uses: actions/upload-artifact@v4
        with:
          name: Ranati-gradle-cache-part-01
          path: /tmp/gradle-cache-part-01
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload cache part 02
        uses: actions/upload-artifact@v4
        with:
          name: Ranati-gradle-cache-part-02
          path: /tmp/gradle-cache-part-02
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
