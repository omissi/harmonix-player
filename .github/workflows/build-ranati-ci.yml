name: Build Ranati 2027 CI

on:
  push:
    branches: [ranati-2027-ci-final]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ranati-2027-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore Ranati source
        shell: bash
        run: |
          set -euo pipefail
          cat ci/ranati/chunk*.b64 | base64 -d > /tmp/ranati-ci-text.tar.gz
          tar -xzf /tmp/ranati-ci-text.tar.gz -C /tmp
          rm -rf ranati_src
          mkdir ranati_src
          cp -a /tmp/ranati_ci_text/. ranati_src/
          test -f ranati_src/app/src/main/java/com/myringtone2027/ranati2027/RanatiApp.kt

      - name: Apply release compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/play-services-ads:25\.4\.0/play-services-ads:24.9.0/' ranati_src/app/build.gradle.kts
          sed -i 's/user-messaging-platform:4\.0\.0/user-messaging-platform:3.2.0/' ranati_src/app/build.gradle.kts
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' ranati_src/app/build.gradle.kts
          sed -i 's/isShrinkResources = true/isShrinkResources = false/' ranati_src/app/build.gradle.kts
          sed -i 's/fun setLanguage(value: AppLanguage)/fun updateLanguage(value: AppLanguage)/' ranati_src/app/src/main/java/com/myringtone2027/ranati2027/Preferences.kt
          sed -i 's/preferences\.setLanguage(/preferences.updateLanguage(/g' ranati_src/app/src/main/java/com/myringtone2027/ranati2027/RanatiApp.kt
          cat > ranati_src/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,3v10.55A4,4 0,1 0,14 17V7h4V3h-6z" />
          </vector>
          EOF
          grep -E 'play-services-ads|user-messaging-platform|isMinifyEnabled|isShrinkResources' ranati_src/app/build.gradle.kts

      - name: Create CI placeholder binary resources
        shell: bash
        run: |
          set -euo pipefail
          cd ranati_src
          mkdir -p app/src/main/res/raw app/src/main/res/drawable app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          PNG='iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAM0lEQVR4nO3OQQEAMAjEsGOSpm4ScTVk8EkNNPVu/yx2NucAAAAAAAAAAAAAAAAAAABJMm13ArHk9K1DAAAAAElFTkSuQmCC'
          for f in app_icon_full cover_1 cover_2 cover_3 cover_4 cover_5 cover_6 cover_7 cover_8; do echo "$PNG" | base64 -d > "app/src/main/res/drawable/$f.png"; done
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do echo "$PNG" | base64 -d > "app/src/main/res/mipmap-$d/ic_launcher.png"; done
          for f in muscat_morning perfume_and_silk last_caravan courtyard_zaffa heliopolis_midnight copper_and_silk cairo_morning_call quarter_zaffa; do printf 'ID3' > "app/src/main/res/raw/$f.mp3"; done

      - name: Unit tests
        working-directory: ranati_src
        run: gradle :app:testDebugUnitTest --stacktrace --no-configuration-cache --max-workers=2

      - name: Build and lint release outputs
        working-directory: ranati_src
        run: gradle :app:assembleRelease :app:bundleRelease :app:lintRelease --stacktrace --no-configuration-cache --max-workers=2

      - name: Collect outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find ranati_src/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          AAB=$(find ranati_src/app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | head -1)
          test -n "$APK" && test -f "$APK"
          test -n "$AAB" && test -f "$AAB"
          cp "$APK" dist/Ranati2027-release-placeholder.apk
          cp "$AAB" dist/Ranati2027-release-placeholder.aab
          cp ranati_src/app/build/reports/lint-results-release.html dist/ 2>/dev/null || true
          tar -C "$ANDROID_SDK_ROOT/build-tools" -czf dist/android-build-tools-36.0.0.tar.gz 36.0.0
          sha256sum dist/* > dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload verified compile outputs
        uses: actions/upload-artifact@v4
        with:
          name: Ranati-2027-CI-verified-placeholders
          path: dist/
          if-no-files-found: error
          retention-days: 3

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Ranati-2027-CI-failure-reports
          path: ranati_src/app/build/reports/
          if-no-files-found: ignore
          retention-days: 3
